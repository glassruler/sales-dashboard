# Nginx site for the dashboard. Copy to /etc/nginx/sites-available/, enable, then run certbot.
# Streamlit needs WebSocket upgrade headers, or the page loads but stays blank.
server {
    listen 80;
    server_name duakelinci.webbros.my.id;

    client_max_body_size 50m;   # CSV uploads

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
